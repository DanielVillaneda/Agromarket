<app-navbar></app-navbar>
<ion-content class="home-content">
  <section class="hero">
    <video #heroVideo class="hero-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="assets/videos/video_1_web.mp4" type="video/mp4" />
    </video>

    <div class="hero-overlay">
      <p class="hero-eyebrow">AgroMarket</p>
      <h1 class="hero-tagline">Conectamos el campo con nuevas oportunidades</h1>
    </div>
  </section>

  <section class="recent">
    <h2 class="recent-title">Lo más reciente</h2>

    <div class="product-grid">
      @for (product of products(); track product.id) {
        <a class="product-link" [routerLink]="['/producto', product.id]">
          <app-product-card [product]="product"></app-product-card>
        </a>
      }
    </div>
  </section>

  <app-footer></app-footer>
</ion-content>
