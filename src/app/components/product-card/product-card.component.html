<article class="product-card">
  <div class="product-thumb" [style.background]="product.accent">
    @if (product.photos && product.photos.length) {
      <img class="product-thumb-photo" [src]="product.photos[0]" alt="" />
    } @else {
      <ion-icon [name]="product.icon" aria-hidden="true"></ion-icon>
    }
  </div>

  <div class="product-info">
    <h3 class="product-title">
      {{ product.title }}
      @if (isMine()) {
        <span class="product-owner-badge">Mío</span>
      }
    </h3>
    <div class="product-price-row">
      <p class="product-price">
        {{ product.price }}
        <span class="product-unit">/ {{ unitLabel }}</span>
      </p>
      @if (!isMine()) {
        <button
          type="button"
          class="product-fav"
          [class.product-fav--active]="isFavorite()"
          (click)="onFavoriteClick($event)"
          [attr.aria-label]="isFavorite() ? 'Quitar de favoritos' : 'Agregar a favoritos'"
          [attr.aria-pressed]="isFavorite()"
        >
          <ion-icon [name]="isFavorite() ? 'heart' : 'heart-outline'" aria-hidden="true"></ion-icon>
        </button>
      }
    </div>
    <p class="product-location">
      <ion-icon name="location-outline" aria-hidden="true"></ion-icon>
      {{ product.location }}
    </p>
  </div>
</article>
